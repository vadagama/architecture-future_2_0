# =============================================================================
# GitHub Actions — CI/CD пайплайн Terraform + Minio backend
# =============================================================================
# Поддерживает три окружения: dev, stage, prod.
# Состояние (tfstate) хранится в Minio (S3-совместимый backend) — НЕ локально.
#
# Триггеры:
#   - push в main → plan для всех окружений
#   - workflow_dispatch → ручной запуск выбранного окружения с apply
# =============================================================================

name: "Terraform CI/CD"

on:
  push:
    branches: [main]
    paths:
      - "Task2Advanced/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Окружение для деплоя"
        required: true
        type: choice
        options: [dev, stage, prod]
      action:
        description: "Действие"
        required: true
        type: choice
        options: [plan, apply]
        default: "plan"

# Отключаем параллельные запуски для одного окружения
concurrency:
  group: "terraform-${{ github.event.inputs.environment || 'all' }}"
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Plan — запускается при push в main и при ручном plan
  # ---------------------------------------------------------------------------
  plan:
    name: "Plan (${{ matrix.env }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, stage, prod]
      fail-fast: false

    # Для prod: план можно показать без approval, apply потребует approval
    defaults:
      run:
        working-directory: Task2Advanced/envs/${{ matrix.env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">=1.3"

      - name: Terraform fmt
        run: terraform fmt -check -recursive ../../

      - name: Terraform Init
        env:
          MINIO_ENDPOINT:   ${{ secrets.MINIO_ENDPOINT }}
          MINIO_BUCKET:     ${{ secrets.MINIO_BUCKET }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          YC_TOKEN:         ${{ secrets.YC_TOKEN }}
        run: |
          terraform init \
            -backend-config="endpoint=${MINIO_ENDPOINT}" \
            -backend-config="bucket=${MINIO_BUCKET}" \
            -backend-config="key=envs/${{ matrix.env }}/terraform.tfstate" \
            -backend-config="access_key=${MINIO_ACCESS_KEY}" \
            -backend-config="secret_key=${MINIO_SECRET_KEY}" \
            -backend-config="region=us-east-1" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="force_path_style=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
        run: terraform plan -var-file="terraform.tfvars" -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: Task2Advanced/envs/${{ matrix.env }}/tfplan
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Apply — запускается только вручную (workflow_dispatch) с action=apply
  # ---------------------------------------------------------------------------
  apply:
    name: "Apply (${{ github.event.inputs.environment }})"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
    # Для prod используем GitHub Environment с protection rules (approvers)
    environment:
      name: ${{ github.event.inputs.environment == 'prod' && 'production' || github.event.inputs.environment }}

    defaults:
      run:
        working-directory: Task2Advanced/envs/${{ github.event.inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">=1.3"

      - name: Terraform Init
        env:
          MINIO_ENDPOINT:   ${{ secrets.MINIO_ENDPOINT }}
          MINIO_BUCKET:     ${{ secrets.MINIO_BUCKET }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          YC_TOKEN:         ${{ secrets.YC_TOKEN }}
        run: |
          terraform init \
            -backend-config="endpoint=${MINIO_ENDPOINT}" \
            -backend-config="bucket=${MINIO_BUCKET}" \
            -backend-config="key=envs/${{ github.event.inputs.environment }}/terraform.tfstate" \
            -backend-config="access_key=${MINIO_ACCESS_KEY}" \
            -backend-config="secret_key=${MINIO_SECRET_KEY}" \
            -backend-config="region=us-east-1" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="force_path_style=true"

      - name: Terraform Plan
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
        run: terraform plan -var-file="terraform.tfvars" -out=tfplan

      - name: Terraform Apply
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
        run: terraform apply -auto-approve tfplan
